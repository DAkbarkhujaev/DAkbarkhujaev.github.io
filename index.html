<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoDile | Modern Timers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Chrono<span>Dial</span></h1>
            <p>Timing and scheduling</p>
        </header>

        <section class="creation-panel card">
            <div class="tabs">
                <button class="tab-btn active" data-target="duration-setup">Duration</button>
                <button class="tab-btn" data-target="schedule-setup">Scheduled</button>
            </div>

            <div id="duration-setup" class="setup-section active">
                <div class="time-inputs">
                    <div class="input-group">
                        <input type="number" id="in-hours" placeholder="00" min="0" max="99">
                        <label>HR</label>
                    </div>
                    <span class="divider">:</span>
                    <div class="input-group">
                        <input type="number" id="in-minutes" placeholder="00" min="0" max="59">
                        <label>MIN</label>
                    </div>
                    <span class="divider">:</span>
                    <div class="input-group">
                        <input type="number" id="in-seconds" placeholder="00" min="0" max="59">
                        <label>SEC</label>
                    </div>
                </div>
            </div>

            <div id="schedule-setup" class="setup-section hidden">
                <div class="input-group full-width">
                    <input type="datetime-local" id="in-datetime">
                    <label>Target Date & Time</label>
                </div>
            </div>

            <div class="actions">
                <input type="text" id="timer-label" placeholder="Timer Label (e.g., Laundry, Meeting)">
                <button id="btn-add" class="btn-primary">Create Timer</button>
            </div>
        </section>

        <main id="timers-grid" class="timers-grid"></main>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
